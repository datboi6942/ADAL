[project]
name = "adal"
version = "0.1.0"
description = "Advanced Deepseek Agent Loop — multi-agent scientific discovery framework"
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "openai>=1.0.0",
    "sqlalchemy>=2.0",
    "aiosqlite>=0.20.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "rich>=13.0",
    "structlog>=24.0",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.0",
    "matplotlib>=3.8",
    "sympy>=1.12",
    "astropy>=6.0",
    "astroquery>=0.4",
    "rdkit>=2024.0",
    "httpx>=0.27",
    "cryptography>=42.0",
    "tenacity>=9.1.4",
    "lancedb>=0.33.0",
    "pyarrow>=24.0.0",
    "textual>=8.2.8",
    "pyperclip>=1.9",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "sse-starlette>=2.2",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pre-commit>=3.7",
]

[project.scripts]
adal = "adal.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 130
target-version = "py311"
lint.select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
